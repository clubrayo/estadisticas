# Configuración de publicación en Netlify.
# Las variables VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY se configuran
# en Netlify (Project configuration → Environment variables), no en este archivo.
[build]
  base    = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Archivos con nombre versionado: se pueden guardar en caché por un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
